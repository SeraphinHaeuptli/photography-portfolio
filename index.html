<!DOCTYPE html>

  <title>Seraphin Haeuptli - Portfolio</title>
  <meta name="description" content="Photography portfolio of Seraphin Haeuptli, based in Switzerland near Aarau." />
  <link rel="icon" type="image/x-icon" href="dist/assets/favicon.ico" />
  <link rel="stylesheet" href="dist/output.css" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      content: ["./dist/*.{html,js}"],
      theme: {
        extend: {
          fontFamily: {
            signika: ["Signika", "sans-serif"],
          },
        },
      },
      plugins: [],
    };
  </script>
  <style>
    #gallery {
      column-count: 1;
      column-gap: 1rem;
    }

    @media (min-width: 640px) {
      #gallery {
        column-count: 2;
      }
    }

    @media (min-width: 1024px) {
      #gallery {
        column-count: 3;
      }
    }

          <button onclick="menuToggle()" @click="open = !open" class="tap-highlight-transparent text-black dark:text-white w-5 h-5 relative focus:outline-none">

            <div class="block w-5 absolute left-1/2 top-1/2 transform -translate-x-1/2 -translate-y-1/2">
              <span aria-hidden="true" class="block absolute h-0.5 w-5 bg-current transform transition duration-500 ease-in-out" :class="{'rotate-45': open, '-translate-y-1.5': !open}"></span>
              <span aria-hidden="true" class="block absolute h-0.5 w-5 bg-current transform transition duration-500 ease-in-out" :class="{'opacity-0': open}"></span>

            <li><a href="dist/about_me.html" class="font-signika text-2xl">ABOUT ME<span class="hidden md:block max-w-0 group-hover:max-w-full transition-all duration-500 h-0.5 bg-black dark:bg-white"></span></a></li>

    <section id="gallery" class="text-neutral-700">
      <a href="dist/assets/aug.jpg" data-photo="aug.jpg" data-fancybox="gallery" class="gallery-item mb-4 block break-inside-avoid overflow-hidden"><img src="dist/assets/aug.jpg" alt="August landscape" class="block w-full h-auto transition duration-500 hover:scale-105" /></a>
      <a href="dist/assets/berg.jpg" data-photo="berg.jpg" data-fancybox="gallery" class="gallery-item mb-4 block break-inside-avoid overflow-hidden"><img src="dist/assets/berg.jpg" alt="Mountain landscape" class="block w-full h-auto transition duration-500 hover:scale-105" /></a>
      <a href="dist/assets/büsch.jpg" data-photo="büsch.jpg" data-fancybox="gallery" class="gallery-item mb-4 block break-inside-avoid overflow-hidden"><img src="dist/assets/büsch.jpg" alt="Bush and natural landscape" class="block w-full h-auto transition duration-500 hover:scale-105" /></a>

    </div>
  </footer>
  <script src="dist/fade_in.js"></script>
  <script src="dist/menu.js"></script>
  <script src="dist/gallery.js"></script>
